[gcode_macro START_PRINT]
 gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    {% set FIRST_LAYER_HEIGHT = params.FIRST_LAYER_HEIGHT|default(0.20)|float %}

    M117 Нагрев стола...
    M190 S{BED_TEMP}                     ; Используем переменную BED_TEMP

    M117 Нагрев сопла...
    M109 S{EXTRUDER_TEMP}                ; Используем переменную EXTRUDER_TEMP
    
    G28                                  ; Калибровка всех осей (Дом) после нагрева стола
    BED_MESH_CLEAR                       ; Временно: диагностический тест без коррекции карты
    # BED_MESH_PROFILE LOAD=default      ; Вернуть после проверки карты

    

    # ==========================================================
    # НАЧАЛО БЛОКА ЛИНИИ ОЧИСТКИ (PURGE LINE)
    # ==========================================================
    M117 Очистка сопла...                
    G90                                  ; Абсолютные координаты
    M83                                  ; Относительный экструдер

    # 1. Быстрый переход к началу линии
    G1 Z5.0 F3000                        ; Приподнимаем сопло
    G1 X5.0 Y10.0 F5000.0                ; В левый ближний угол
    G1 Z{FIRST_LAYER_HEIGHT} F3000                       ; Опускаем на высоту слоя

    # 2. Нагнетание давления и первая линия (Медленная скорость F600)
    G92 E0                               ; Обнуляем экструдер
    G1 X5.0 Y140.0 Z{FIRST_LAYER_HEIGHT} F600.0 E15      ; Линия вверх, плавно выдавливаем 15мм
    
    # 3. Смещение вбок
    G1 X5.4 Y140.0 Z{FIRST_LAYER_HEIGHT} F5000.0         ; Быстрый сдвиг вправо
    
    # 4. Вторая линия обратно (Медленная скорость F600)
    G1 X5.4 Y10.0 Z{FIRST_LAYER_HEIGHT} F600.0 E15       ; Линия вниз, плавно выдавливаем еще 15мм
    
    # 5. Сброс давления и старт печати
    G92 E0                               ; Обнуляем экструдер
    G1 E-0.5 F2100                       ; Короткий откат 0.5мм
    G1 Z3.0 F3000                        ; Отрыв от стола вверх
    G1 X10.0 F5000                       ; Отскок вбок от капли
    M117 Печать...
    # ==========================================================



 [gcode_macro END_PRINT]
 gcode:
    M140 S0
    M104 S0
    M106 S0

    # Получаем текущую позицию Z и максимальную из конфига
    {% set current_z = printer.toolhead.position.z %}
    {% set max_z = printer.configfile.settings.stepper_z.position_max|default(180) %}
    {% set lift = 20 %}   # желаемый подъём
    {% set target_z = current_z + lift %}
    {% if target_z > max_z %}
        {% set target_z = max_z - 2 %}  # оставляем 2 мм запаса
    {% endif %}

    # Поднимаемся на вычисленную высоту (абсолютная координата)
    G90
    G1 Z{target_z} F3000

    # Отвод в сторону и парковка
    G91
    G1 X-2 Y-2 E-3 F300
    G90
    G1 X0 Y200 F3600

    M84 X Y
