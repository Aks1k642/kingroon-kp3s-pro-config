[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 5000
max_z_velocity: 25
max_z_accel: 100
square_corner_velocity: 5.0

[input_shaper]
shaper_freq_x: 32.41
shaper_freq_y: 35.92
shaper_type_x: mzv
shaper_type_y: mzv

[bed_screws]
screw1: 20,20
screw2: 190,190
screw3: 190,20
screw4: 20,190

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000
restart_method: command

[virtual_sdcard]
path: /home/aks1k642/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[temperature_sensor raspberry]
sensor_type: temperature_host

[temperature_sensor MCU]
sensor_type: temperature_mcu

[static_digital_output display_reset]
pins: !PC6, !PD13

[gcode_arcs]
resolution: 0.05

[display_status]
[pause_resume]
[respond]

[include fluidd.cfg]

[verify_heater heater_bed]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

[verify_heater extruder]
max_error: 120
check_gain_time: 30
hysteresis: 5
heating_gain: 2

[include stepper.cfg]
[include tmc.cfg]
[include thermistor.cfg]
[include extruder.cfg]
[include bed.cfg]
[include fan.cfg]

[exclude_object]

[bltouch]
sensor_pin: ^PC4         # Обязательно ставим ^ перед ! чтобы пин не "шумел" и не вешал плату
control_pin: PA8
pin_up_reports_not_triggered: False
pin_up_touch_mode_reports_triggered: False
probe_with_touch_mode: False
x_offset: 26
y_offset: 1
speed: 5.0
samples: 2

[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_min: 30, 20
mesh_max: 190, 180
probe_count: 5, 5
algorithm: bicubic
bicubic_tension: 0.2
mesh_pps: 2, 2
fade_start: 1
fade_end: 10
move_check_distance: 5
split_delta_z: .01
zero_reference_position: 100, 100

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

[include Macros.cfg]

[screws_tilt_adjust]
# Находим координаты для screw1 (обычно передний левый винт).
# Передвигаем голову руками или стрелками так, чтобы BLTouch был строго над винтом.
# Смотрим на координаты СОПЛА в веб-интерфейсе и записываем их сюда:
screw1: 25, 30
screw1_name: передний левый (базовый)

screw2: 150, 30
screw2_name: передний правый

screw3: 150, 200
screw3_name: задний правый

screw4: 25, 200
screw4_name: задний левый

# Скорость перемещения между винтами
speed: 100

# Высота, на которую поднимается Z перед перемещением к следующему винту
horizontal_move_z: 5

# Тип резьбы ваших регулировочных винтов:
# CW - по часовой стрелке (винты затягиваются/стол опускается при вращении по часовой)
# CCW - против часовой стрелки
# M3, M4, M5 - диаметр (и соответственно шаг) резьбы. На большинстве принтеров (Ender 3 и др.) стоят винты M4.
screw_thread: CW-M4

